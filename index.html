  <script>
    // 3-Month Countdown Timer Logic
    (function initCountdown() {
      const STORAGE_KEY = 'launch_target_date_v1';
      const THREE_MONTHS_MS = 90 * 24 * 60 * 60 * 1000; // 90 days in milliseconds
      let targetTime;

      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = parseInt(stored, 10);
          if (!isNaN(parsed) && parsed > Date.now()) {
            targetTime = parsed;
          }
        }
      } catch (e) {
        // Handle localStorage restrictions if loaded as file://
      }

      if (!targetTime) {
        targetTime = Date.now() + THREE_MONTHS_MS;
        try {
          localStorage.setItem(STORAGE_KEY, targetTime.toString());
        } catch (e) { }
      }

      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');

      function padZero(num) {
        return num < 10 ? '0' + num : num.toString();
      }

      function update() {
        const now = Date.now();
        const difference = targetTime - now;

        if (difference <= 0) {
          daysEl.textContent = '00';
          hoursEl.textContent = '00';
          minutesEl.textContent = '00';
          secondsEl.textContent = '00';
          return;
        }

        const totalSeconds = Math.floor(difference / 1000);
        const days = Math.floor(totalSeconds / (3600 * 24));
        const hours = Math.floor((totalSeconds % (3600 * 24)) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        daysEl.textContent = padZero(days);
        hoursEl.textContent = padZero(hours);
        minutesEl.textContent = padZero(minutes);
        secondsEl.textContent = padZero(seconds);
      }

      update();
      setInterval(update, 1000);
    })();
  </script>
